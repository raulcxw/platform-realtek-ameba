[env:rtl8721f]
platform = amebartos
framework = ambsdk
board = rtl8721f

; ─── 远程烧录配置（开发态：板子在另一台机器，本机通过 remote serial 走）───
upload_port = COM40
board_upload.remote_server = 127.0.0.1
board_upload.remote_password = 87654321
; board_upload.memory_type = nor       ; 默认 nor
; board_upload.chip_erase = no         ; yes 会先全片擦除

; ─── monitor 配置 ───
; monitor_speed = 1500000              ; Ameba LogUART 默认就是 1500000，可不写
; custom_monitor_reset = yes           ; CI/抓 boot log 用：触发软重启再 capture
; custom_monitor_no_console = yes      ; 强制非交互（默认会自动判断 isatty）

; v0.1: 不需要源代码 — ameba.py build 编 SDK 自带 default project
; 后续 v0.2 加 src/ 时，再让 builder/main.py 把它注入 ameba.py 的 -a / --new
